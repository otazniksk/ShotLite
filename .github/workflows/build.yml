# Tag vX.Y.Z: build the installer and the portable zip and publish them as a GitHub Release.
#   git tag v1.0.0 && git push origin v1.0.0
# Pull request / manual run (Actions -> Run workflow): the same build as workflow artifacts, no release.
# Plain pushes to main don't build.
name: Build

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # gh release create

jobs:
  build:
    runs-on: windows-latest
    # Only tags reach the signing key, and the environment makes each release wait for manual approval.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history: ShotLite.csproj stamps the version from git

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag '$env:GITHUB_REF_NAME' is not vX.Y.Z" }
            $number = $Matches[1]
            $display = $number
          } else {
            [xml]$project = Get-Content src/ShotLite/ShotLite.csproj
            $number = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
            $branch = $env:GITHUB_HEAD_REF ? $env:GITHUB_HEAD_REF : $env:GITHUB_REF_NAME
            $display = "$number-$($branch -replace '[^0-9A-Za-z.-]', '-')+$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "number=$number" >> $env:GITHUB_OUTPUT
          "display=$display" >> $env:GITHUB_OUTPUT
          Write-Host "Version $display"

      # Self-contained: users need no .NET runtime. The languages folder stays next to the exe.
      - name: Publish
        env:
          # MSBuild properties, see ShotLite.csproj. An empty variable counts as unset.
          UpdateRepository: ${{ github.repository }}
          UpdatePublicKey: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: >
          dotnet publish src/ShotLite/ShotLite.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o out/app

      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup 7 has all app languages incl. Chinese; runners ship version 6 and Chocolatey stops at 6.x.
          # Official release from github.com/jrsoftware/issrc, pinned by SHA-256.
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
            $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
            if ($hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw "Inno Setup checksum mismatch: $hash" }
            Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 7 not found at $iscc" }
          Write-Host "Using $iscc"
          & $iscc /Qp "/DVersion=${{ steps.version.outputs.display }}" "/DNumericVersion=${{ steps.version.outputs.number }}" "/DSourceDir=..\out\app" installer\ShotLite.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Sign update
        if: github.ref_type == 'tag' && (github.repository == 'otazniksk/ShotLite' || vars.UPDATE_PUBLIC_KEY != '')
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: installer/sign-update.ps1 out/ShotLite-install.exe ${{ steps.version.outputs.number }}

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path out/app/* -DestinationPath out/ShotLite-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ShotLite-${{ steps.version.outputs.display }}
          path: |
            out/ShotLite-install.exe
            out/ShotLite-portable.zip
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @('out/ShotLite-install.exe', 'out/ShotLite-portable.zip')
          if (Test-Path out/ShotLite-install.exe.sig) { $files += 'out/ShotLite-install.exe.sig' }
          gh release create "$env:GITHUB_REF_NAME" @files --title "ShotLite ${{ steps.version.outputs.number }}" --generate-notes --verify-tag
